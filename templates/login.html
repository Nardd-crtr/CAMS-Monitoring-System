{% extends "base.html" %}

{% block title %}Login - CAMS{% endblock %}

{% block content %}
<div style="max-width: 400px; margin: 4rem auto;">
    <div class="card">
        <h2 style="margin-bottom: 1.5rem; text-align: center;">Login to CAMS</h2>
        
        <form method="POST" action="{{ url_for('login') }}">
            <div style="margin-bottom: 1rem;">
                <label for="username" style="display: block; margin-bottom: 0.5rem; color: var(--text-secondary);">Username</label>
                <input 
                    type="text" 
                    id="username" 
                    name="username" 
                    required 
                    style="width: 100%;"
                    autocomplete="username"
                    autofocus
                >
            </div>
            
            <div style="margin-bottom: 1.5rem;">
                <label for="password" style="display: block; margin-bottom: 0.5rem; color: var(--text-secondary);">Password</label>
                <input 
                    type="password" 
                    id="password" 
                    name="password" 
                    required 
                    style="width: 100%;"
                    autocomplete="current-password"
                >
            </div>
            
            <button type="submit" class="btn" style="width: 100%; font-size: 1rem; padding: 0.75rem;">
                Login
            </button>
        </form>
    </div>
    
    <p style="text-align: center; margin-top: 1rem; color: var(--text-secondary); font-size: 0.875rem;">
        Computer Availability Monitoring System
    </p>
</div>
{% endblock %}
